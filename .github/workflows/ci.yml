name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest -q
      - name: Benchmark quality gate (selective vs full, injected faults)
        # Offline, deterministic (fixture backend) — exits non-zero if any
        # success criterion fails, false-negative bound included.
        run: python benchmark/run_benchmark.py
